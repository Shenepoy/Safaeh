name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check version format
        run: bash ./scripts/check_version.sh

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Analyze example
        run: |
          cd example
          flutter pub get
          dart analyze --fatal-infos

      - name: Test example
        run: |
          cd example
          flutter test

      - name: Upload widget images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-images
          path: screenshots/*.png
          if-no-files-found: error

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Verify example Wasm and JavaScript fallback
        working-directory: example
        run: |
          flutter build web --release --wasm
          test -s build/web/main.dart.wasm
          test -s build/web/main.dart.mjs
          test -s build/web/main.dart.js

  widgetbook:
    name: Widgetbook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widgetbook
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install catalog dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check catalog formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze catalog
        run: dart analyze --fatal-infos

      - name: Test catalog
        run: flutter test

      - name: Build catalog web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/widgetbook/"

      - name: Upload catalog web
        uses: actions/upload-artifact@v4
        with:
          name: widgetbook-web
          path: widgetbook/build/web
          if-no-files-found: error

  pages:
    name: GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [analyze-and-test, widgetbook]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build example web
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release --wasm --base-href "/${{ github.event.repository.name }}/"

      - name: Add Widgetbook to the combined site
        uses: actions/download-artifact@v4
        with:
          name: widgetbook-web
          path: example/build/web/widgetbook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
