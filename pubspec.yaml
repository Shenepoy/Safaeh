name: safaeh
description: Adaptive sheets, dialogs, camera/QR chrome, page index, and sidenav for Flutter.
version: 0.5.0
homepage: https://github.com/Zyzto/Safaeh
repository: https://github.com/Zyzto/Safaeh
issue_tracker: https://github.com/Zyzto/Safaeh/issues
license: MPL-2.0
screenshots:
  - description: Card picker
    path: screenshots/picker.png
  - description: Confirm sheet
    path: screenshots/confirm.png
  - description: Option tiles
    path: screenshots/option-tiles.png
  - description: Sidenav rail
    path: screenshots/sidenav.png

environment:
  sdk: ^3.11.0
  flutter: ">=3.11.0"

dependencies:
  flutter:
    sdk: flutter
  toastification: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
