name: safaeh
description: Adaptive sheets, dialogs, camera/QR chrome, page index, and sidenav for Flutter.
version: 1.1.1
homepage: https://github.com/Shenepoy/Safaeh
repository: https://github.com/Shenepoy/Safaeh
issue_tracker: https://github.com/Shenepoy/Safaeh/issues
license: MPL-2.0
screenshots:
  - description: Card picker
    path: screenshots/picker.png
  - description: Confirm sheet
    path: screenshots/confirm.png
  - description: Option tiles
    path: screenshots/option-tiles.png
  - description: Sidenav rail
    path: screenshots/sidenav.png

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  material_ui: ^1.11.0
  camera_cutout: ^0.1.0
  flutter:
    sdk: flutter
  toastification: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - shaders/safaeh_genie.frag
